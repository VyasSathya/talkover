name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2 tmux

      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx fastapi uvicorn python-multipart

      - name: Every Python file compiles
        run: python -m compileall -q src hooks engines scripts/demo extras

      - name: Shell scripts parse (macOS / Linux)
        if: runner.os != 'Windows'
        run: for f in install.sh start.sh stop.sh; do bash -n "$f"; done

      - name: PowerShell scripts parse (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in 'install.ps1','start.ps1','stop.ps1','hooks/speak-response.ps1','hooks/stop-speaking.ps1','scripts/demo/demo.ps1') {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e)
            if ($e.Count) { Write-Host "$f : $($e.Count) parse errors"; $bad++ }
          }
          exit $bad

      - name: Tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests -q -rs

      - name: Modules import without a sound device or screen (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cd src
          python -c "import platform_util, voice_config, delivery_posix, speak_nav, voice_chats, install_hooks, voice_watchdog, voice_health; print('imports ok')"
